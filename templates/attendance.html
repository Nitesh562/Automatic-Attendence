<!doctype html><html><head><meta charset="utf-8"><title>Attendance</title><link rel="stylesheet" href="/static/style.css"></head>
<body><nav><b>Face Attendance</b><span><a href="/">Home</a><a href="/register">Register</a><a href="/attendance">Attendance</a></span></nav>
<main class="container"><h1>Mark Attendance</h1><div class="grid"><div class="card"><video id="video" autoplay playsinline></video><canvas id="canvas" hidden></canvas><p id="status">Starting camera...</p></div><div class="card"><h2>Today's recognition</h2><div id="person">No student recognized yet.</div><a class="btn" href="/api/export">Export CSV</a></div></div><div class="card"><h2>Attendance Records</h2><table><thead><tr><th>Name</th><th>Roll No</th><th>Date</th><th>Time</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
let busy=false;
async function start(){const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=s;setInterval(scan,1500);load();}
async function scan(){if(busy||video.videoWidth===0)return;busy=true;const c=canvas,ctx=c.getContext("2d");c.width=video.videoWidth;c.height=video.videoHeight;ctx.drawImage(video,0,0);
try{const r=await fetch("/api/recognize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:c.toDataURL("image/jpeg",.8)})});const j=await r.json();if(j.ok){person.innerHTML="<b>"+j.student.name+"</b><br>Roll: "+j.student.roll_no+"<br>"+j.message;status.textContent=j.message;load();}else status.textContent=j.message||"Looking for a face...";}finally{busy=false}}
async function load(){const r=await fetch("/api/attendance"),d=await r.json();rows.innerHTML=d.map(x=>`<tr><td>${x.name}</td><td>${x.roll_no}</td><td>${x.date}</td><td>${x.time}</td></tr>`).join("")}
start().catch(e=>status.textContent="Camera error: "+e.message);
</script></body></html>
